<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script>
(function(){
  var listEl = document.getElementById('list');
  var form = document.getElementById('form');
  var nameEl = document.getElementById('name');
  var msgEl = document.getElementById('msg');
  var sendEl = document.getElementById('send');
  var statusEl = document.getElementById('status');
  var db = null, isOwner = false, entries = [];

  function setStatus(t){ statusEl.textContent = t || ''; }

  function render(){
    listEl.textContent = '';
    if (!entries.length){
      var e = document.createElement('p');
      e.className = 'empty';
      e.textContent = 'No entries yet. Be the first to sign!';
      listEl.appendChild(e);
      return;
    }
    entries.forEach(function(en){
      var box = document.createElement('article'); box.className = 'entry';
      var meta = document.createElement('div'); meta.className = 'meta';
      var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = en.name;
      var right = document.createElement('span');
      right.textContent = new Date(en.ts).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
      if (isOwner && en.id){
        var d = document.createElement('button'); d.className = 'del'; d.type = 'button'; d.textContent = 'delete';
        d.onclick = function(){ db.collection('entries').doc(en.id).delete().catch(function(){ setStatus('Couldn’t delete that entry.'); }); };
        right.appendChild(document.createTextNode(' '));
        right.appendChild(d);
      }
      meta.appendChild(nm); meta.appendChild(right);
      var p = document.createElement('p'); p.textContent = en.message;
      box.appendChild(meta); box.appendChild(p);
      listEl.appendChild(box);
    });
  }

  function localLoad(){
    try { return JSON.parse(localStorage.getItem('guestbook-local') || '[]'); } catch(e){ return []; }
  }
  function localSave(){
    try { localStorage.setItem('guestbook-local', JSON.stringify(entries)); } catch(e){}
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var name = nameEl.value.trim(), message = msgEl.value.trim();
    if (!name || !message) return;
    var entry = {name: name.slice(0,60), message: message.slice(0,500), ts: Date.now()};
    sendEl.disabled = true; setStatus('Saving…');
    if (db){
      db.collection('entries').add(entry).then(function(){
        msgEl.value = ''; setStatus('Thanks for signing!');
      }).catch(function(){
        setStatus('Couldn’t save. You may need Contributor access to sign.');
      }).then(function(){ sendEl.disabled = false; });
    } else {
      entries.unshift(entry); localSave(); render();
      msgEl.value = ''; setStatus('Saved on this device only.');
      sendEl.disabled = false;
    }
  });

  render();

  if (window.claude && claude.use){
    Promise.all([claude.use('db'), claude.use('user')]).then(function(r){
      db = r[0];
      if (r[1]) { try { isOwner = !!r[1].isOwner(); } catch(e){} }
      if (!db){ entries = localLoad(); render(); setStatus('Shared storage unavailable. Entries stay on this device.'); return; }
      db.collection('entries').orderBy('ts','desc').limit(200).onSnapshot(function(snap){
        entries = snap.docs.map(function(d){ var x = d.data() || {}; x.id = d.id; return x; });
        render();
      }, function(){ setStatus('Couldn’t load entries.'); });
    }).catch(function(){ entries = localLoad(); render(); });
  } else {
    entries = localLoad(); render();
  }
})();
</script>
