<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script>
(function(){
  var listEl = document.getElementById('list');
  var form = document.getElementById('form');
  var nameEl = document.getElementById('name');
  var msgEl = document.getElementById('msg');
  var statusEl = document.getElementById('status');

  function setStatus(t){ statusEl.textContent = t || ''; }

  function render(){
    listEl.textContent = '';
    if (!window.guestbookEntries || !window.guestbookEntries.length){
      var e = document.createElement('p');
      e.className = 'empty';
      e.textContent = 'No entries yet. Be the first to sign!';
      listEl.appendChild(e);
      return;
    }
    window.guestbookEntries.forEach(function(en){
      var box = document.createElement('article'); box.className = 'entry';
      var meta = document.createElement('div'); meta.className = 'meta';
      var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = en.name;
      var right = document.createElement('span');
      var date = new Date(en.created_at);
      right.textContent = isNaN(date.getTime()) ? '' : date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
      meta.appendChild(nm); meta.appendChild(right);
      var p = document.createElement('p'); p.textContent = en.message;
      box.appendChild(meta); box.appendChild(p);
      listEl.appendChild(box);
    });
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var name = nameEl.value.trim(), message = msgEl.value.trim();
    if (!name || !message) return;
    var title = 'Guestbook: ' + name.slice(0,60);
    var url = new URL('https://github.com/helenlin/guestbook/issues/new');
    url.searchParams.set('title', title);
    url.searchParams.set('body', message.slice(0,500));
    setStatus('Opening GitHub so you can submit your message…');
    window.location.href = url.toString();
  });

  render();
  fetch('./guestbook.json')
    .then(function(response){
      if (!response.ok) throw new Error('Guestbook feed request failed');
      return response.json();
    })
    .then(function(entries){
      if (!Array.isArray(entries)) throw new Error('Guestbook feed is invalid');
      window.guestbookEntries = entries;
      render();
      setStatus('');
    })
    .catch(function(){
      setStatus('Guestbook entries could not be loaded. Please try again later.');
    });
})();
</script>
