name: Add guestbook entries

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  add-entry:
    if: "startsWith(github.event.issue.title, 'Guestbook: ')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record guestbook entry
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 scripts/record_guestbook_entry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guestbook.md guestbook.json
          if git diff --cached --quiet; then
            echo "Guestbook already contains this issue."
            exit 0
          fi
          git commit -m "Add guestbook entry from issue #${{ github.event.issue.number }}"
          git push
